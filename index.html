<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Paddington Toggle Models</title>
    
    <!-- Підключаємо A-Frame та MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- Плагін анімації -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        /* Екран-заставка на весь екран */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 1);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        #splash-screen img {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #splash-screen h2 {
            color: white;
            font-family: sans-serif;
            font-size: 24px;
            text-align: center;
            padding: 15px 20px;
            z-index: 2;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            margin: 0 20px;
        }
    </style>
</head>
<body>

    <!-- Заставка для розблокування звуку та запуску AR -->
    <div id="splash-screen">
        <img src="./backgraund.jpg" alt="Start AR" onerror="this.src='https://via.placeholder.com/250/ff4757/ffffff?text=AR+Paddington'">
        <h2>Тисни сюди, щоб запустити AR та музику!</h2>
    </div>

    <!-- AR Сцена -->
    <a-scene 
        id="arScene"
        mindar-image="imageTargetSrc: ./targets.mind;" 
        color-space="sRGB" 
        renderer="colorManagement: true, precision: mediump, antialias: true" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: true">
        
        <a-assets>
            <!-- 3D Моделі -->
            <a-asset-item id="modelPaddington" src="./paddington.glb"></a-asset-item>
            <a-asset-item id="modelDance" src="./dance.glb"></a-asset-item>
            <a-asset-item id="modelWaves" src="./waves_hand.glb"></a-asset-item>
            <a-asset-item id="modelSecondDance" src="./second_dance.glb"></a-asset-item>

            <!-- Аудіофайли з циклом -->
            <audio id="audio1" src="./music1.mp3" preload="auto" loop></audio>
            <audio id="audio3" src="./music3.mp3" preload="auto" loop></audio>
            <audio id="audio2" src="./music2.mp3" preload="auto" loop></audio>
            <audio id="audio4" src="./music4.mp3" preload="auto"></audio>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Сутність маркера з подіями появи/зникнення -->
        <a-entity id="markerEntity" mindar-image-target="targetIndex: 0" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="5">
            
            <!-- Модель 1: Paddington (music1.mp3) -->
            <a-gltf-model 
                id="pad1"
                src="#modelPaddington" 
                position="0 -0.1 0" 
                rotation="0 0 0" 
                scale="0.49 0.49 0.49"
                animation-mixer="clip: *; loop: repeat;"
                visible="true"
                shadow="cast: false; receive: false">
            </a-gltf-model>

            <!-- Модель 2: Waves (music3.mp3) -->
            <a-gltf-model 
                id="pad3"
                src="#modelWaves" 
                position="0 -0.5 0" 
                rotation="0 0 0" 
                scale="0.49 0.49 0.49"
                animation-mixer="clip: *; loop: repeat;"
                visible="false"
                shadow="cast: false; receive: false">
            </a-gltf-model>

            <!-- Модель 3: Dance (music2.mp3) -->
            <a-gltf-model 
                id="pad2"
                src="#modelDance" 
                position="0 -0.5 0" 
                rotation="0 0 0" 
                scale="0.49 0.49 0.49"
                animation-mixer="clip: *; loop: repeat;"
                visible="false"
                shadow="cast: false; receive: false">
            </a-gltf-model>

            <!-- Модель 4: Second Dance (music4.mp3) -->
            <a-gltf-model 
                id="pad4"
                src="#modelSecondDance" 
                position="0 -0.5 0" 
                rotation="0 0 0" 
                scale="0.49 0.49 0.49"
                animation-mixer="clip: *; loop: repeat;"
                visible="false"
                shadow="cast: false; receive: false">
            </a-gltf-model>

        </a-entity>

    </a-scene>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const splashScreen = document.querySelector("#splash-screen");
            const markerEntity = document.querySelector("#markerEntity");

            const models = [
                document.querySelector("#pad1"),
                document.querySelector("#pad3"),
                document.querySelector("#pad2"),
                document.querySelector("#pad4")
            ];

            const audios = [
                document.querySelector("#audio1"),
                document.querySelector("#audio3"),
                document.querySelector("#audio2"),
                document.querySelector("#audio4")
            ];

            let currentIndex = 0;
            let isTargetVisible = false;
            let audioInitialized = false;

            const playCurrentAudio = () => {
                if (!audioInitialized) return;
                audios.forEach((audio, i) => {
                    if (i === currentIndex) {
                        if (isTargetVisible) {
                            audio.play().catch(e => console.log("Play error:", e));
                        }
                    } else {
                        audio.pause();
                        audio.currentTime = 0;
                    }
                });
            };

            const stopAllAudio = () => {
                audios.forEach(audio => {
                    audio.pause();
                    audio.currentTime = 0;
                });
            };

            splashScreen.addEventListener("click", () => {
                splashScreen.style.display = "none";
                audioInitialized = true;

                audios[0].play().then(() => {
                    audios[0].pause();
                    audios[0].currentTime = 0;
                    if (isTargetVisible) {
                        playCurrentAudio();
                    }
                }).catch(err => console.log("Audio unlock failed:", err));
            });

            markerEntity.addEventListener("targetFound", () => {
                isTargetVisible = true;
                if (audioInitialized) {
                    playCurrentAudio();
                }
            });

            markerEntity.addEventListener("targetLost", () => {
                isTargetVisible = false;
                stopAllAudio();
            });

            window.addEventListener("click", (e) => {
                if (e.target.closest("#splash-screen")) return;
                if (!audioInitialized) return;

                models[currentIndex].setAttribute("visible", "false");
                currentIndex = (currentIndex + 1) % models.length;
                models[currentIndex].setAttribute("visible", "true");
                
                playCurrentAudio();
                console.log("Переключено на модель та аудіо номер:", currentIndex + 1);
            });
        });
    </script>

</body>
</html>
