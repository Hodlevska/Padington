<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Paddington Toggle Models</title>
    
    <!-- Підключаємо A-Frame та MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- Плагін анімації -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        /* Екран-заставка на весь екран */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 1);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        #splash-screen img {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #splash-screen h2 {
            color: white;
            font-family: sans-serif;
            font-size: 24px;
            text-align: center;
            padding: 15px 20px;
            z-index: 2;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            margin: 0 20px;
        }
    </style>
</head>
<body>

    <!-- Заставка для розблокування звуку та запуску AR -->
    <div id="splash-screen">
        <img src="./backgraund.jpg" alt="Start AR" onerror="this.src='https://via.placeholder.com/250/ff4757/ffffff?text=AR+Paddington'">
        <h2>Тисни сюди, щоб запустити AR та музику!</h2>
    </div>

    <!-- AR Сцена -->
    <a-scene 
        id="arScene"
        mindar-image="imageTargetSrc: ./targets.mind;" 
        color-space="sRGB" 
        renderer="colorManagement: true, precision: mediump, antialias: true" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: true">
        
        <a-assets>
            <!-- 3D Моделі: Paddington + Waves + 10 танців -->
            <a-asset-item id="modelPaddington" src="./paddington.glb"></a-asset-item>
            <a-asset-item id="modelWaves" src="./waves_hand.glb"></a-asset-item>
            <a-asset-item id="modelDance1" src="./dance_1.glb"></a-asset-item>
            <a-asset-item id="modelDance2" src="./dance_2.glb"></a-asset-item>
            <a-asset-item id="modelDance3" src="./dance_3.glb"></a-asset-item>
            <a-asset-item id="modelDance4" src="./dance_4.glb"></a-asset-item>
            <a-asset-item id="modelDance5" src="./dance_5.glb"></a-asset-item>
            <a-asset-item id="modelDance6" src="./dance_6.glb"></a-asset-item>
            <a-asset-item id="modelDance7" src="./dance_7.glb"></a-asset-item>
            <a-asset-item id="modelDance8" src="./dance_8.glb"></a-asset-item>
            <a-asset-item id="modelDance9" src="./dance_9.glb"></a-asset-item>
            <a-asset-item id="modelDance10" src="./dance_10.glb"></a-asset-item>

            <!-- Аудіофайли від 1 до 12 для кожної моделі -->
            <audio id="audio1" src="./music1.mp3" preload="auto" loop></audio>
            <audio id="audio2" src="./music2.mp3" preload="auto" loop></audio>
            <audio id="audio3" src="./music3.mp3" preload="auto" loop></audio>
            <audio id="audio4" src="./music4.mp3" preload="auto" loop></audio>
            <audio id="audio5" src="./music5.mp3" preload="auto" loop></audio>
            <audio id="audio6" src="./music6.mp3" preload="auto" loop></audio>
            <audio id="audio7" src="./music7.mp3" preload="auto" loop></audio>
            <audio id="audio8" src="./music8.mp3" preload="auto" loop></audio>
            <audio id="audio9" src="./music9.mp3" preload="auto" loop></audio>
            <audio id="audio10" src="./music10.mp3" preload="auto" loop></audio>
            <audio id="audio11" src="./music11.mp3" preload="auto" loop></audio>
            <audio id="audio12" src="./music12.mp3" preload="auto" loop></audio>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Сутність маркера з подіями появи/зникнення -->
        <a-entity id="markerEntity" mindar-image-target="targetIndex: 0" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="5">
            
            <!-- 0. Paddington (music1.mp3) -->
            <a-gltf-model id="pad0" src="#modelPaddington" position="0 -0.1 0" rotation="0 0 0" scale="0.49 0.49 0.49" animation-mixer="clip: *; loop: repeat;" visible="true" shadow="cast: false; receive: false"></a-gltf-model>
            
            <!-- 1. Waves Hand (music2.mp3) -->
            <a-gltf-model id="pad1" src="#modelWaves" position="0 -0.5 0" rotation="0 0 0" scale="0.49 0.49 0.49" animation-mixer="clip: *; loop: repeat;" visible="false" shadow="cast: false; receive: false"></a-gltf-model>

            <!-- 2. Dance 1 (music3.mp3) -->
            <a-gltf-model id="pad2" src="#modelDance1" position="0 -0.5 0" rotation="0 0 0" scale="0.49 0.49 0.49" animation-mixer="clip: *; loop: repeat;" visible="false" shadow="cast: false; receive: false"></a-gltf-model>

            <!-- 3. Dance 2 (music4.mp3) -->
            <a-gltf-model id="pad3" src="#modelDance2" position="0 -0.5 0" rotation="0 0 0" scale="0.49 0.49 0.49" animation-mixer="clip: *; loop: repeat;" visible="false" shadow="cast: false; receive: false"></a-gltf-model>

            <!-- 4. Dance 3 (music5.mp3) -->
            <a-gltf-model id="pad4" src="#modelDance3" position="0 -0.5 0" rotation="0 0 0" scale="0.49 0.49 0.49" animation-mixer="clip: *; loop: repeat;" visible="false" shadow="cast: false; receive: false"></a-gltf-model>

            <!-- 5. Dance 4 (music6.mp3) -->
            <a-gltf-model id="pad5" src="#modelDance4" position="0 -0.5 0" rotation="0 0 0" scale="0.49 0.49 0.49" animation-mixer="clip: *; loop: repeat;" visible="false" shadow="cast: false; receive: false"></a-gltf-model>

            <!-- 6. Dance 5 (music7.mp3) -->
            <a-gltf-model id="pad6" src="#modelDance5" position="0 -0.5 0" rotation="0 0 0" scale="0.49 0.49 0.49" animation-mixer="clip: *; loop: repeat;" visible="false" shadow="cast: false; receive: false"></a-gltf-model>

            <!-- 7. Dance 6 (music8.mp3) -->
            <a-gltf-model id="pad7" src="#modelDance6" position="0 -0.5 0" rotation="0 0 0" scale="0.49 0.49 0.49" animation-mixer="clip: *; loop: repeat;" visible="false" shadow="cast: false; receive: false"></a-gltf-model>

            <!-- 8. Dance 7 (music9.mp3) -->
            <a-gltf-model id="pad8" src="#modelDance7" position="0 -0.5 0" rotation="0 0 0" scale="0.49 0.49 0.49" animation-mixer="clip: *; loop: repeat;" visible="false" shadow="cast: false; receive: false"></a-gltf-model>

            <!-- 9. Dance 8 (music10.mp3) -->
            <a-gltf-model id="pad9" src="#modelDance8" position="0 -0.5 0" rotation="0 0 0" scale="0.49 0.49 0.49" animation-mixer="clip: *; loop: repeat;" visible="false" shadow="cast: false; receive: false"></a-gltf-model>

            <!-- 10. Dance 9 (music11.mp3) -->
            <a-gltf-model id="pad10" src="#modelDance9" position="0 -0.5 0" rotation="0 0 0" scale="0.49 0.49 0.49" animation-mixer="clip: *; loop: repeat;" visible="false" shadow="cast: false; receive: false"></a-gltf-model>

            <!-- 11. Dance 10 (music12.mp3) -->
            <a-gltf-model id="pad11" src="#modelDance10" position="0 -0.5 0" rotation="0 0 0" scale="0.49 0.49 0.49" animation-mixer="clip: *; loop: repeat;" visible="false" shadow="cast: false; receive: false"></a-gltf-model>

        </a-entity>

    </a-scene>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const splashScreen = document.querySelector("#splash-screen");
            const markerEntity = document.querySelector("#markerEntity");

            const models = [
                document.querySelector("#pad0"),
                document.querySelector("#pad1"),
                document.querySelector("#pad2"),
                document.querySelector("#pad3"),
                document.querySelector("#pad4"),
                document.querySelector("#pad5"),
                document.querySelector("#pad6"),
                document.querySelector("#pad7"),
                document.querySelector("#pad8"),
                document.querySelector("#pad9"),
                document.querySelector("#pad10"),
                document.querySelector("#pad11")
            ];

            const audios = [
                document.querySelector("#audio1"),
                document.querySelector("#audio2"),
                document.querySelector("#audio3"),
                document.querySelector("#audio4"),
                document.querySelector("#audio5"),
                document.querySelector("#audio6"),
                document.querySelector("#audio7"),
                document.querySelector("#audio8"),
                document.querySelector("#audio9"),
                document.querySelector("#audio10"),
                document.querySelector("#audio11"),
                document.querySelector("#audio12")
            ];

            let currentIndex = 0;
            let isTargetVisible = false;
            let audioInitialized = false;

            const playCurrentAudio = () => {
                if (!audioInitialized) return;
                audios.forEach((audio, i) => {
                    if (i === currentIndex) {
                        if (isTargetVisible) {
                            audio.play().catch(e => console.log("Play error:", e));
                        }
                    } else {
                        audio.pause();
                        audio.currentTime = 0;
                    }
                });
            };

            const stopAllAudio = () => {
                audios.forEach(audio => {
                    audio.pause();
                    audio.currentTime = 0;
                });
            };

            splashScreen.addEventListener("click", () => {
                splashScreen.style.display = "none";
                audioInitialized = true;

                audios[0].play().then(() => {
                    audios[0].pause();
                    audios[0].currentTime = 0;
                    if (isTargetVisible) {
                        playCurrentAudio();
                    }
                }).catch(err => console.log("Audio unlock failed:", err));
            });

            markerEntity.addEventListener("targetFound", () => {
                isTargetVisible = true;
                if (audioInitialized) {
                    playCurrentAudio();
                }
            });

            markerEntity.addEventListener("targetLost", () => {
                isTargetVisible = false;
                stopAllAudio();
            });

            window.addEventListener("click", (e) => {
                if (e.target.closest("#splash-screen")) return;
                if (!audioInitialized) return;

                models[currentIndex].setAttribute("visible", "false");
                currentIndex = (currentIndex + 1) % models.length;
                models[currentIndex].setAttribute("visible", "true");
                
                playCurrentAudio();
                console.log("Переключено на модель та аудіо індекс:", currentIndex);
            });
        });
    </script>

</body>
</html>
