<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Paddington Toggle Models</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <style>
        /* ВАЖЛИВО: жодного фону на html/body — інакше він закриває відео з камери */
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }
        a-scene, .a-canvas {
            background: transparent !important;
        }

        #splash-screen {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        #splash-screen img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        #splash-screen h2 {
            position: relative;
            z-index: 2;
            margin: 0 20px;
            padding: 15px 20px;
            color: #fff;
            font: 24px sans-serif;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
        }

        /* Статус внизу екрана (видно навіть поверх заставки) */
        #status {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%);
            z-index: 10000;
            max-width: 90vw;
            padding: 10px 18px;
            color: #fff;
            font: 15px sans-serif;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 22px;
            display: none;
            pointer-events: none;
        }
        #status.show { display: flex; align-items: center; gap: 10px; }
        #status .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex: none;
        }
        #status.no-spinner .spinner { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="./backgraund.jpg" alt="Start AR"
             onerror="this.onerror=null; this.src='https://via.placeholder.com/250/ff4757/ffffff?text=AR+Paddington'">
        <h2>Тисни сюди, щоб запустити AR та музику!</h2>
    </div>

    <div id="status"><span class="spinner"></span><span id="status-text"></span></div>

    <!--
        Налаштування проти тремтіння (рівень 1 — фільтр MindAR):
          filterMinCF — менше = менше тремтіння (більше запізнення)
          filterBeta  — менше = плавніше при русі (більше запізнення)
        Рівень 2 — pose-smoother на #stabilizer (параметр factor, 0.05–1):
          менше = плавніше, але модель повільніше наздоганяє маркер.
    -->
    <a-scene
        id="arScene"
        mindar-image="imageTargetSrc: ./targets.mind;
                      filterMinCF: 0.00005;
                      filterBeta: 5;
                      missTolerance: 10;
                      warmupTolerance: 5;
                      maxTrack: 1;"
        color-space="sRGB"
        renderer="colorManagement: true; precision: mediump; antialias: true; alpha: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: true">

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Маркер: тільки відстежує позицію, моделей не містить -->
        <a-entity id="markerEntity" mindar-image-target="targetIndex: 0"></a-entity>

        <!-- Сюди додаються моделі; позиція згладжується відносно маркера -->
        <a-entity id="stabilizer" pose-smoother="target: #markerEntity; factor: 0.15"></a-entity>
    </a-scene>

    <audio id="player" loop preload="auto" playsinline></audio>

    <script>
        // ===== Додаткове згладжування позиції/повороту/масштабу моделі =====
        AFRAME.registerComponent("pose-smoother", {
            schema: {
                target: { type: "selector" },
                factor: { type: "number", default: 0.15 }
            },
            init() {
                this.p = new THREE.Vector3();
                this.q = new THREE.Quaternion();
                this.s = new THREE.Vector3();
                this.hasPose = false;
                this.el.object3D.visible = false;
            },
            tick(time, dt) {
                const target = this.data.target && this.data.target.object3D;
                const obj = this.el.object3D;
                if (!target) return;

                if (!target.visible) {
                    // Маркер втрачено — ховаємо модель і скидаємо позу
                    obj.visible = false;
                    this.hasPose = false;
                    return;
                }

                target.updateMatrixWorld(true);
                target.matrixWorld.decompose(this.p, this.q, this.s);

                if (!this.hasPose) {
                    // Перша поза після появи маркера — без плавного "прольоту"
                    obj.position.copy(this.p);
                    obj.quaternion.copy(this.q);
                    obj.scale.copy(this.s);
                    this.hasPose = true;
                } else {
                    // Незалежно від FPS
                    const alpha = 1 - Math.pow(1 - this.data.factor, (dt || 16.7) / 16.7);
                    obj.position.lerp(this.p, alpha);
                    obj.quaternion.slerp(this.q, alpha);
                    obj.scale.lerp(this.s, alpha);
                }
                obj.visible = true;
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            // ===== Конфігурація: модель + музика + висота по осі Y =====
            const SCALE = "0.50 0.50 0.50";   // розмір (менше = менший ведмідь)
            const OFFSET_X = 0;          // вправо (мінус = вліво)
            const OFFSET_Z = 0;            // до камери (плюс) / від камери (мінус)
            const ROTATION = "80 0 0";   // X Y Z у градусах (приклад: нахил на 20° вперед)
            const ITEMS = [
                { model: "./paddington.glb", audio: "./music1.mp3",  y: -0.1 },
                { model: "./waves_hand.glb", audio: "./music2.mp3",  y: -0.5 },
                { model: "./dance_1.glb",    audio: "./music3.mp3",  y: -0.5 },
                { model: "./dance_2.glb",    audio: "./music4.mp3",  y: -0.5 },
                { model: "./dance_3.glb",    audio: "./music5.mp3",  y: -0.5 },
                { model: "./dance_4.glb",    audio: "./music6.mp3",  y: -0.5 },
                { model: "./dance_5.glb",    audio: "./music7.mp3",  y: -0.5 },
                { model: "./dance_6.glb",    audio: "./music8.mp3",  y: -0.5 },
                { model: "./dance_7.glb",    audio: "./music9.mp3",  y: -0.5 },
                { model: "./dance_8.glb",    audio: "./music10.mp3", y: -0.5 },
                { model: "./dance_9.glb",    audio: "./music11.mp3", y: -0.5 },
                { model: "./dance_10.glb",   audio: "./music12.mp3", y: -0.5 }
            ];

            const scene = document.querySelector("#arScene");
            const splashScreen = document.querySelector("#splash-screen");
            const markerEntity = document.querySelector("#markerEntity");
            const stabilizer = document.querySelector("#stabilizer");
            const player = document.querySelector("#player");
            const statusBox = document.querySelector("#status");
            const statusText = document.querySelector("#status-text");

            let currentIndex = 0;
            let isTargetVisible = false;
            let started = false;
            let arReady = false;
            let loadedCount = 0;      // скільки моделей уже завершили завантаження (успішно або з помилкою)
            let errorText = "";

            const models = [];        // { el, loaded }

            // ===== Статус внизу екрана =====
            const updateStatus = () => {
                let text = "";
                let spinner = true;

                if (errorText) {
                    text = errorText;
                    spinner = false;
                } else if (!arReady) {
                    text = "Завантаження AR…";
                } else if (loadedCount < ITEMS.length) {
                    text = `Завантаження моделей: ${loadedCount}/${ITEMS.length}`;
                } else if (!isTargetVisible) {
                    text = "Наведіть камеру на маркер";
                    spinner = false;
                }

                if (!text) {
                    statusBox.classList.remove("show");
                    return;
                }
                statusText.textContent = text;
                statusBox.classList.toggle("no-spinner", !spinner);
                statusBox.classList.add("show");
            };

            const flashError = (text) => {
                errorText = text;
                updateStatus();
                setTimeout(() => { errorText = ""; updateStatus(); }, 3000);
            };

            scene.addEventListener("arReady", () => { arReady = true; updateStatus(); });
            scene.addEventListener("arError", () => flashError("Не вдалося запустити камеру/AR"));

            // ===== Моделі: створюються один раз, вантажаться по черзі =====
            const loadModel = (i) => {
                if (i >= ITEMS.length) return;

                const item = ITEMS[i];
                const el = document.createElement("a-gltf-model");
                el.setAttribute("src", item.model);
                el.setAttribute("position", `${OFFSET_X} ${item.y} ${OFFSET_Z}`);
                el.setAttribute("scale", SCALE);
                el.setAttribute("rotation", "-10 0 0");
                // Невидимі моделі стоять на паузі (timeScale: 0) — економить ресурси
                el.setAttribute("animation-mixer", `clip: *; loop: repeat; timeScale: ${i === currentIndex ? 1 : 0}`);
                el.setAttribute("shadow", "cast: false; receive: false");
                el.setAttribute("visible", i === currentIndex ? "true" : "false");

                const entry = { el, done: false };
                models[i] = entry;

                const finish = () => {
                    if (entry.done) return;
                    entry.done = true;
                    loadedCount++;
                    updateStatus();
                    loadModel(i + 1);   // вантажимо наступну
                };

                el.addEventListener("model-loaded", finish);
                el.addEventListener("model-error", () => {
                    flashError(`Не вдалося завантажити модель ${i + 1}`);
                    finish();
                });

                stabilizer.appendChild(el);
            };

            const showModel = (index) => {
                models.forEach((m, i) => {
                    if (!m) return;
                    const on = i === index;
                    m.el.setAttribute("visible", on ? "true" : "false");
                    m.el.setAttribute("animation-mixer", "timeScale", on ? 1 : 0);
                });
            };

            // ===== Звук =====
            const setTrack = (index) => {
                player.src = ITEMS[index].audio;
                player.currentTime = 0;
            };

            const playCurrentAudio = () => {
                if (!started || !isTargetVisible) return;
                player.play().catch((e) => console.log("Play error:", e));
            };

            const stopAudio = () => {
                player.pause();
                player.currentTime = 0;
            };

            // ===== Старт (клік по заставці розблоковує звук) =====
            splashScreen.addEventListener("click", (e) => {
                e.stopPropagation();
                splashScreen.style.display = "none";
                started = true;

                setTrack(currentIndex);
                player.play()
                    .then(() => { if (!isTargetVisible) stopAudio(); })
                    .catch((err) => console.log("Audio unlock failed:", err));
            });

            // ===== Події маркера =====
            markerEntity.addEventListener("targetFound", () => {
                isTargetVisible = true;
                updateStatus();
                playCurrentAudio();
            });

            markerEntity.addEventListener("targetLost", () => {
                isTargetVisible = false;
                updateStatus();
                stopAudio();
            });

            // ===== Перемикання модель + музика по тапу =====
            window.addEventListener("click", () => {
                if (!started) return;

                currentIndex = (currentIndex + 1) % ITEMS.length;
                showModel(currentIndex);
                setTrack(currentIndex);
                playCurrentAudio();
                console.log("Переключено на індекс:", currentIndex);
            });

            document.addEventListener("visibilitychange", () => {
                if (document.hidden) player.pause();
                else playCurrentAudio();
            });

            // Старт: показуємо статус і починаємо завантаження з першої моделі
            updateStatus();
            loadModel(0);
        });
    </script>

</body>
</html>
