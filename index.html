<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Paddington</title>
    
    <!-- Підключаємо A-Frame та MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- Сцена з прив'язкою до твого файлу targets.mind -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: true" embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true">
        
        <a-assets>
            <!-- Підключаємо твою модель paddington.glb -->
            <a-asset-item id="paddingtonModel" src="./paddington.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Сутність маркера -->
        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model 
                src="#paddingtonModel" 
                position="0 -0.2 0" 
                rotation="0 0 0" 
                scale="0.8 0.8 0.8"
                animation-mixer>
            </a-gltf-model>
        </a-entity>

    </a-scene>

</body>
</html>
