<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Paddington Stable Animation</title>
    
    <!-- Підключаємо A-Frame та MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- Додаємо офіційний плагін анімації для glTF -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- AR Сцена з чистим швидким трекінгом -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind;" 
        color-space="sRGB" 
        renderer="colorManagement: true, precision: mediump, antialias: true" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: true">
        
        <!-- Завантажуємо 3D-модель у кеш -->
        <a-assets>
            <a-asset-item id="paddingtonModel" src="./animatedbear.glb"></a-asset-item>
        </a-assets>

        <!-- Налаштування камери -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Сутність маркера зі згладжуванням (smooth), що прибирає дрижання моделі -->
        <a-entity mindar-image-target="targetIndex: 0" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="5">
            <!-- Сама модель Падінгтона з анімацією -->
            <a-gltf-model 
                src="#paddingtonModel" 
                position="0 -0.5 0" 
                rotation="0 0 0" 
                scale="0.49 0.49 0.49"
                animation-mixer
                shadow="cast: false; receive: false">
            </a-gltf-model>
        </a-entity>

    </a-scene>

</body>
</html>
